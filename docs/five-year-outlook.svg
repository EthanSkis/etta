<text class="note" x="100" y="906">Every line assumes you keep going for five years. The dashed payer line is not better execution of this plan — it is a different plan, and it turns on a signature rather than on effort.</text>
<text class="note" x="100" y="926">Conversion, churn and CAC are still unmeasured, so treat the band as the honest width of what is unknown rather than as a confidence interval.</text>
