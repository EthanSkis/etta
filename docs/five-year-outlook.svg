<text class="t" x="100" y="52">Five years: a reasonable range</text>
<text class="st" x="100" y="80">Subscribers held, month by month. Log scale — the range spans two orders of magnitude. The band is bear to bull; the solid line is the central estimate.</text>
<text class="stm" x="100" y="104">Tuned conservatively against the category's base rate — no competitor in the market research has disclosed a user number, and the biggest raise was a $3.5M seed.</text>
