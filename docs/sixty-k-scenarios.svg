<rect width="1360" height="960" fill="var(--surface)"/>
<text class="t" x="96" y="52">Is there a real world with 60,000 subscribers?</text>
<text class="st" x="96" y="80">Ten years, log scale. Acquisition in every channel slows as the market fills, so no run can outsell the households that exist.</text>
<text class="stm" x="96" y="104">Yes — but only in worlds where paid acquisition clears a hard reinvestment threshold, or a payer contract does the work instead.</text>
